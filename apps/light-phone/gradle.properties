# gradle.properties for the MealForge Light Phone build.
#
# Keep this file free of machine paths: the SDK checkout is located by
# scripts/bootstrap-sdk.sh (or the LIGHT_SDK_DIR/ANDROID_HOME environment) and
# sdk.dir lives in the git-ignored local.properties.

kotlin.code.style=official
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.parallel=true
